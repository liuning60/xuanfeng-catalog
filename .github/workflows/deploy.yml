name: Publish

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch page source
        run: |
          curl -fsSL "https://aka.doubaocdn.com/s/WsMS7qMVvo" -o /tmp/index.html
          wc -c /tmp/index.html

      - name: Publish to gh-pages branch
        run: |
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          git checkout --orphan gh-pages
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/index.html ./index.html
          touch .nojekyll
          git add -A
          git commit -m "publish page"
          git push origin gh-pages --force
