name: Publish

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch page source
        run: |
          curl -fsSL "https://aka.doubaocdn.com/s/WsMS7qMVvo" -o /tmp/index.html
          wc -c /tmp/index.html

      - name: Commit page back to repo
        run: |
          if cmp -s /tmp/index.html index.html; then echo "no change"; exit 0; fi
          cp /tmp/index.html index.html
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          git add index.html
          git commit -m "publish catalog page [skip ci]"
          git push

      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: dep
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
